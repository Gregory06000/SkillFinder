<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220">
  <!-- Body -->
  <ellipse cx="100" cy="130" rx="65" ry="60" fill="#C45D3E"/>
  <ellipse cx="100" cy="140" rx="42" ry="38" fill="#E8805F" opacity="0.5"/>

  <!-- Head (drooping slightly) -->
  <g transform="rotate(3, 100, 68)">
    <circle cx="100" cy="68" r="48" fill="#C45D3E"/>
    <circle cx="100" cy="65" r="38" fill="#D4704E"/>

    <!-- Sad eyes -->
    <ellipse cx="82" cy="62" rx="12" ry="13" fill="white"/>
    <ellipse cx="118" cy="62" rx="12" ry="13" fill="white"/>
    <circle cx="84" cy="64" r="6" fill="#1A1714"/>
    <circle cx="120" cy="64" r="6" fill="#1A1714"/>
    <circle cx="86" cy="61" r="2.5" fill="white"/>
    <circle cx="122" cy="61" r="2.5" fill="white"/>

    <!-- Sad eyebrows -->
    <path d="M72 52 Q80 48 92 54" fill="none" stroke="#1A1714" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M108 54 Q120 48 128 52" fill="none" stroke="#1A1714" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Sad mouth -->
    <path d="M84 82 Q100 74 116 82" fill="none" stroke="#1A1714" stroke-width="3" stroke-linecap="round"/>

    <!-- Blush -->
    <ellipse cx="70" cy="76" rx="8" ry="5" fill="#E8805F" opacity="0.6"/>
    <ellipse cx="130" cy="76" rx="8" ry="5" fill="#E8805F" opacity="0.6"/>

    <!-- Hat (slightly askew) -->
    <path d="M52 52 Q55 25 100 20 Q145 25 148 52" fill="#D4A853"/>
    <ellipse cx="100" cy="52" rx="52" ry="8" fill="#D4A853"/>
    <ellipse cx="100" cy="52" rx="52" ry="8" fill="#C49643" opacity="0.4"/>
    <rect x="55" y="48" width="90" height="6" rx="3" fill="#1A1714" opacity="0.2"/>
  </g>

  <!-- Left arm hanging down -->
  <path d="M38 125 Q25 145 30 165 Q32 170 36 167" fill="#C45D3E" stroke="#B04E33" stroke-width="1.5"/>

  <!-- Right arm holding magnifying glass down -->
  <path d="M162 125 Q175 145 170 165 Q168 170 164 167" fill="#C45D3E" stroke="#B04E33" stroke-width="1.5"/>

  <!-- Magnifying glass on the ground -->
  <line x1="164" y1="167" x2="158" y2="180" stroke="#D4A853" stroke-width="5" stroke-linecap="round"/>
  <circle cx="152" cy="190" r="15" fill="none" stroke="#D4A853" stroke-width="4" opacity="0.6"/>

  <!-- Feet -->
  <ellipse cx="78" cy="188" rx="20" ry="10" fill="#B04E33"/>
  <ellipse cx="122" cy="188" rx="20" ry="10" fill="#B04E33"/>

  <text x="100" y="150" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle" opacity="0.7">SF</text>
</svg>
