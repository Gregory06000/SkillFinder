<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Shadow -->
  <ellipse cx="60" cy="114" rx="28" ry="5" fill="#1A1714" opacity="0.08"/>

  <!-- Body -->
  <ellipse cx="60" cy="78" rx="32" ry="28" fill="#C45D3E"/>

  <!-- Head (slightly drooping) -->
  <g transform="rotate(3, 60, 44)">
    <circle cx="60" cy="44" r="30" fill="#C45D3E"/>
    <circle cx="60" cy="43" r="24" fill="#D9725A"/>

    <!-- Sad eyes -->
    <ellipse cx="50" cy="42" rx="5.5" ry="6" fill="white"/>
    <ellipse cx="70" cy="42" rx="5.5" ry="6" fill="white"/>
    <circle cx="51" cy="43" r="3" fill="#1A1714"/>
    <circle cx="71" cy="43" r="3" fill="#1A1714"/>
    <circle cx="52" cy="41" r="1.2" fill="white"/>
    <circle cx="72" cy="41" r="1.2" fill="white"/>

    <!-- Sad eyebrows -->
    <path d="M44 36 Q48 33 55 37" fill="none" stroke="#1A1714" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M65 37 Q72 33 76 36" fill="none" stroke="#1A1714" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Sad mouth -->
    <path d="M50 54 Q60 49 70 54" fill="none" stroke="#1A1714" stroke-width="2" stroke-linecap="round"/>

    <!-- Cheeks -->
    <circle cx="42" cy="49" r="4" fill="#E8805F" opacity="0.5"/>
    <circle cx="78" cy="49" r="4" fill="#E8805F" opacity="0.5"/>

    <!-- Explorer hat (slightly askew) -->
    <ellipse cx="60" cy="22" rx="28" ry="5" fill="#D4A853"/>
    <path d="M34 22 Q36 6 60 2 Q84 6 86 22" fill="#D4A853"/>
    <path d="M34 22 Q36 8 60 4 Q84 8 86 22" fill="#E5BE6A" opacity="0.5"/>
    <rect x="37" y="19" width="46" height="4" rx="2" fill="#B8943E" opacity="0.3"/>
  </g>

  <!-- Left arm hanging -->
  <path d="M30 72 Q24 85 28 96" fill="none" stroke="#C45D3E" stroke-width="7" stroke-linecap="round"/>

  <!-- Right arm hanging with magnifying glass down -->
  <path d="M90 72 Q96 85 92 96" fill="none" stroke="#C45D3E" stroke-width="7" stroke-linecap="round"/>

  <!-- Magnifying glass on the ground -->
  <line x1="92" y1="96" x2="96" y2="102" stroke="#D4A853" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="100" cy="108" r="8" fill="none" stroke="#D4A853" stroke-width="3" opacity="0.5"/>

  <!-- Feet -->
  <ellipse cx="48" cy="106" rx="10" ry="5" fill="#A84E35"/>
  <ellipse cx="72" cy="106" rx="10" ry="5" fill="#A84E35"/>
</svg>
