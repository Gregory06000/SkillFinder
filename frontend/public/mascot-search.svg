<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220">
  <!-- Body -->
  <ellipse cx="100" cy="130" rx="65" ry="60" fill="#C45D3E"/>
  <ellipse cx="100" cy="140" rx="42" ry="38" fill="#E8805F" opacity="0.5"/>

  <!-- Head (slightly tilted for searching pose) -->
  <g transform="rotate(-5, 100, 68)">
    <circle cx="100" cy="68" r="48" fill="#C45D3E"/>
    <circle cx="100" cy="65" r="38" fill="#D4704E"/>

    <!-- Eyes - focused/squinting -->
    <ellipse cx="82" cy="60" rx="12" ry="10" fill="white"/>
    <ellipse cx="118" cy="60" rx="12" ry="10" fill="white"/>
    <circle cx="86" cy="59" r="6" fill="#1A1714"/>
    <circle cx="122" cy="59" r="6" fill="#1A1714"/>
    <circle cx="88" cy="56" r="2.5" fill="white"/>
    <circle cx="124" cy="56" r="2.5" fill="white"/>

    <!-- Determined mouth -->
    <path d="M86 78 Q100 88 114 78" fill="none" stroke="#1A1714" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Blush -->
    <ellipse cx="70" cy="74" rx="8" ry="5" fill="#E8805F" opacity="0.6"/>
    <ellipse cx="130" cy="74" rx="8" ry="5" fill="#E8805F" opacity="0.6"/>

    <!-- Hat -->
    <path d="M52 52 Q55 25 100 20 Q145 25 148 52" fill="#D4A853"/>
    <ellipse cx="100" cy="52" rx="52" ry="8" fill="#D4A853"/>
    <ellipse cx="100" cy="52" rx="52" ry="8" fill="#C49643" opacity="0.4"/>
    <rect x="55" y="48" width="90" height="6" rx="3" fill="#1A1714" opacity="0.2"/>
  </g>

  <!-- Left arm pointing forward -->
  <path d="M38 120 Q15 110 10 100 Q8 95 14 93" fill="#C45D3E" stroke="#B04E33" stroke-width="1.5"/>

  <!-- Right arm holding magnifying glass up -->
  <path d="M162 110 Q185 90 178 70 Q175 62 170 68" fill="#C45D3E" stroke="#B04E33" stroke-width="1.5"/>

  <!-- Large magnifying glass (searching pose) -->
  <line x1="170" y1="68" x2="155" y2="45" stroke="#D4A853" stroke-width="6" stroke-linecap="round"/>
  <circle cx="145" cy="30" r="22" fill="none" stroke="#D4A853" stroke-width="5"/>
  <circle cx="145" cy="30" r="16" fill="#E0F0FF" opacity="0.4"/>
  <path d="M136 22 Q140 17 145 16" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

  <!-- Search sparkles -->
  <g fill="#D4A853" opacity="0.8">
    <polygon points="120,12 122,17 127,17 123,20 124,25 120,22 116,25 117,20 113,17 118,17"/>
    <polygon points="170,15 171,18 174,18 172,20 173,23 170,21 167,23 168,20 166,18 169,18" transform="scale(0.7) translate(75, 5)"/>
  </g>

  <!-- Feet -->
  <ellipse cx="78" cy="188" rx="20" ry="10" fill="#B04E33"/>
  <ellipse cx="122" cy="188" rx="20" ry="10" fill="#B04E33"/>

  <text x="100" y="150" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle" opacity="0.7">SF</text>
</svg>
