<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Shadow -->
  <ellipse cx="60" cy="114" rx="28" ry="5" fill="#1A1714" opacity="0.08"/>

  <!-- Body -->
  <ellipse cx="60" cy="78" rx="32" ry="28" fill="#C45D3E"/>

  <!-- Head -->
  <circle cx="60" cy="44" r="30" fill="#C45D3E"/>

  <!-- Face -->
  <circle cx="60" cy="43" r="24" fill="#D9725A"/>

  <!-- Eyes -->
  <ellipse cx="50" cy="40" rx="5.5" ry="6" fill="white"/>
  <ellipse cx="70" cy="40" rx="5.5" ry="6" fill="white"/>
  <circle cx="51.5" cy="39.5" r="3" fill="#1A1714"/>
  <circle cx="71.5" cy="39.5" r="3" fill="#1A1714"/>
  <circle cx="52.5" cy="37.5" r="1.2" fill="white"/>
  <circle cx="72.5" cy="37.5" r="1.2" fill="white"/>

  <!-- Smile -->
  <path d="M50 52 Q60 60 70 52" fill="none" stroke="#1A1714" stroke-width="2" stroke-linecap="round"/>

  <!-- Cheeks -->
  <circle cx="42" cy="49" r="4" fill="#E8805F" opacity="0.5"/>
  <circle cx="78" cy="49" r="4" fill="#E8805F" opacity="0.5"/>

  <!-- Explorer hat -->
  <ellipse cx="60" cy="22" rx="28" ry="5" fill="#D4A853"/>
  <path d="M34 22 Q36 6 60 2 Q84 6 86 22" fill="#D4A853"/>
  <path d="M34 22 Q36 8 60 4 Q84 8 86 22" fill="#E5BE6A" opacity="0.5"/>
  <rect x="37" y="19" width="46" height="4" rx="2" fill="#B8943E" opacity="0.3"/>

  <!-- Magnifying glass (right hand) -->
  <line x1="84" y1="72" x2="96" y2="58" stroke="#D4A853" stroke-width="4" stroke-linecap="round"/>
  <circle cx="100" cy="52" r="11" fill="none" stroke="#D4A853" stroke-width="3.5"/>
  <circle cx="100" cy="52" r="7" fill="white" opacity="0.2"/>
  <path d="M96 48 Q98 46 100 45.5" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>

  <!-- Left arm -->
  <path d="M30 70 Q22 78 24 88" fill="none" stroke="#C45D3E" stroke-width="7" stroke-linecap="round"/>
  <!-- Right arm -->
  <path d="M90 70 Q86 72 84 72" fill="none" stroke="#C45D3E" stroke-width="7" stroke-linecap="round"/>

  <!-- Feet -->
  <ellipse cx="48" cy="106" rx="10" ry="5" fill="#A84E35"/>
  <ellipse cx="72" cy="106" rx="10" ry="5" fill="#A84E35"/>
</svg>
